<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marian Schools Portal — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

  <a class="brand-lockup" href="index.html">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="20" cy="20" r="20" fill="#F7F1E3"/>
      <path d="M20 8 L20 24 L10 24 Z" fill="#E0A526"/>
      <path d="M8 26 Q20 30 32 26 L29 30 Q20 33 11 30 Z" fill="#12283A"/>
    </svg>
    Marian Schools
  </a>

  <div class="container">

    <!-- Account Icon at top right -->
    <div id="accountIcon" title="Account" class="account-icon" tabindex="0">
      <span id="accountInitials">👤</span>
    </div>

    <!-- Dropdown menu for logged-in user -->
    <div id="accountMenu" class="account-menu" style="display:none;">
      <p id="accountUserName" class="menu-item"></p>
      <button id="logoutButton" class="logout-button menu-item">Logout</button>
    </div>

    <h1>Welcome back</h1>
    <p class="subhead">Sign in to reach results, the calendar and admissions.</p>

    <!-- Welcome message -->
    <div id="welcomeMessage" style="display:none;"></div>

    <!-- Login Form -->
    <form class="login-form" id="loginForm">
      <label for="student-id">Student ID</label>
      <input type="text" id="student-id" placeholder="Enter your ID" required />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" required />
        <span id="togglePassword" class="eye">👁️</span>
      </div>

      <button type="submit">Log in</button>

      <!-- Forgot Password link -->
      <p id="forgotPassword" class="link-text" style="margin-top: 4px;">
        Forgot password?
      </p>

      <p id="showSignup" class="link-text">New here? Create an account</p>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" style="display:none;" class="login-form">
      <label for="new-student-id">Create Student ID</label>
      <input type="text" id="new-student-id" placeholder="Choose an ID" required />

      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" placeholder="Enter your full name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="new-password">Create Password</label>
      <div class="password-wrapper">
        <input type="password" id="new-password" placeholder="Choose a password" required />
        <span id="toggleNewPassword" class="eye">👁️</span>
      </div>

      <button type="submit">Sign up</button>
      <p id="showLogin" class="link-text">Already have an account? Log in</p>
    </form>

    <!-- Links -->
    <div class="links" id="linksContainer" style="display:none;">
      <a href="apply.html">📄 Apply for Admission</a>
      <a href="calendar.html">📅 Academic Calendar</a>
      <a href="results.html">📊 View Results</a>
      <a href="teachers.html">👨‍🏫 Meet Teachers</a>
    </div>

    <!-- Logout (legacy container, can remain hidden now) -->
    <div id="logoutContainer" style="display:none; margin-top: 20px; text-align: center;">
      <button id="logoutButtonLegacy" class="logout-button">Logout</button>
    </div>

    <!-- Footer -->
    <footer>Marian Schools © <span id="year"></span></footer>
  </div>

  <script src="login.js"></script>
</body>
</html>
